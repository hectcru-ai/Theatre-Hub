<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141a;
    --panel: #1a1d25;
    --panel-raised: #23262f;
    --panel-line: #333844;
    --text: #e9e6de;
    --text-dim: #9195a3;
    --text-faint: #656a78;
    --gold: #c9973f;
    --gold-dim: #8a6c34;
    --go: #52a05f;
    --standby: #c1443b;
    --tape: #e8dec0;
    --tape-shadow: #a89a6f;
    --focus: #d9b25f;
    --radius: 6px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(201,151,63,0.05), transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(82,160,95,0.04), transparent 50%);
  }
  a{ color: var(--gold); }
  ::selection{ background: var(--gold-dim); color: #fff; }
  *:focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- App shell ---------- */
  .app{
    display: grid;
    grid-template-columns: 216px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 780px){
    .app{ grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar / console rail ---------- */
  .rail{
    background: linear-gradient(180deg, #15171d, #101217);
    border-right: 1px solid var(--panel-line);
    padding: 20px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (max-width: 780px){
    .rail{ border-right:none; border-bottom: 1px solid var(--panel-line); flex-direction: row; align-items: center; overflow-x: auto; padding: 14px; }
  }
  .wordmark{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: 0.02em;
    line-height: 1.1;
    color: var(--text);
    white-space: nowrap;
  }
  .wordmark small{
    display:block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    font-weight: 400;
    color: var(--text-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  @media (max-width: 780px){ .wordmark{ flex: 0 0 auto; margin-right: 6px; } .wordmark small{ display:none; } }

  .strip-list{ display:flex; flex-direction:column; gap:10px; }
  @media (max-width: 780px){ .strip-list{ flex-direction:row; } }

  .strip{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 10px 10px 12px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    transition: transform 0.15s ease, background 0.15s ease;
    min-width: 150px;
  }
  .strip:hover{ background: var(--panel-raised); }
  .strip.active{
    background: var(--panel-raised);
    transform: translateX(4px);
    box-shadow: inset 3px 0 0 var(--show-color, var(--gold));
  }
  @media (max-width: 780px){
    .strip.active{ transform: translateY(2px); box-shadow: inset 0 3px 0 var(--show-color, var(--gold)); }
  }
  .strip-edge{
    height: 4px;
    width: 34px;
    border-radius: 3px;
    background: var(--show-color, var(--gold));
    margin-bottom: 8px;
  }
  .strip-tape{
    display: inline-block;
    background: var(--tape);
    color: #2b2510;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1;
    padding: 3px 8px 4px;
    border-radius: 2px;
    transform: rotate(-1.2deg);
    box-shadow: 0 1px 0 var(--tape-shadow);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .strip-meta{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-faint);
    margin-top: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .add-show-btn{
    background: none;
    border: 1px dashed var(--panel-line);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.82rem;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
  }
  .add-show-btn:hover{ border-color: var(--gold-dim); color: var(--text); }
  @media (max-width: 780px){ .add-show-btn{ white-space: nowrap; min-width: 110px; } }

  .rail-footer{
    margin-top: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }
  @media (max-width: 780px){ .rail-footer{ display:none; } }

  /* ---------- Main ---------- */
  .main{ padding: 22px 28px 60px; max-width: 980px; }
  @media (max-width: 600px){ .main{ padding: 18px 16px 48px; } }

  .show-header{ margin-bottom: 6px; }
  .show-title{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0;
    line-height: 1.05;
  }
  .show-sub{
    color: var(--text-dim);
    font-size: 0.92rem;
    margin-top: 4px;
  }
  .show-sub span{ color: var(--text-faint); margin: 0 6px; }

  .waveline{
    height: 14px;
    margin: 14px 0 20px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .waveline i{
    display:block;
    width: 2px;
    background: var(--gold-dim);
    border-radius: 1px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity: 0.35; }
    50%{ opacity: 0.9; }
  }

  .tabs{
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--panel-line);
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-btn{
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{ color: var(--gold); border-bottom-color: var(--gold); }

  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 18px 18px 20px;
  }
  .panel + .panel{ margin-top: 16px; }

  .panel-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .panel-head h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin: 0;
  }
  .panel-head .hint{ font-size: 0.75rem; color: var(--text-faint); }

  .btn{
    background: var(--panel-raised);
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.8rem;
    padding: 7px 12px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .btn:hover{ border-color: var(--gold-dim); }
  .btn-gold{ background: var(--gold); border-color: var(--gold); color: #1a1508; font-weight: 600; }
  .btn-gold:hover{ background: #d9a94a; }
  .btn-ghost{ background: none; border: none; color: var(--text-faint); }
  .btn-ghost:hover{ color: var(--standby); }
  .btn-sm{ padding: 4px 9px; font-size: 0.72rem; }

  table{ width: 100%; border-collapse: collapse; }
  th{
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--panel-line);
  }
  td{
    padding: 7px 8px;
    border-bottom: 1px solid #232630;
    vertical-align: top;
    font-size: 0.86rem;
  }
  tr:last-child td{ border-bottom: none; }
  td input[type=text], td input[type=date], td textarea, .field{
    width: 100%;
    background: #0f1116;
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 6px 8px;
    border-radius: 4px;
  }
  td textarea{ resize: none; min-height: 34px; overflow: hidden; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; font-family: inherit; }
  select.field{ background: #0f1116; }

  .status-chip{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .status-Draft{ background: #232630; color: var(--text-dim); }
  .status-Programmed{ background: rgba(201,151,63,0.15); color: var(--gold); border-color: var(--gold-dim); }
  .status-Confirmed{ background: rgba(82,160,95,0.15); color: var(--go); border-color: #3f7a49; }

  .table-scroll{ overflow-x: auto; }
  tr.flag-row{ box-shadow: inset 3px 0 0 var(--standby); }
  .flag-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background: var(--standby); margin-right:6px; vertical-align: middle;
    flex-shrink: 0;
  }

  /* Home / To-do */
  .todo-row{
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid #232630;
  }
  .todo-row:last-child{ border-bottom: none; }
  .todo-label{ font-size: 0.88rem; font-weight: 500; }
  .todo-date{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--gold);
    white-space: nowrap;
    padding-top: 1px;
  }
  .todo-row.decision .todo-label{ color: var(--text); }
  .todo-row .flag-dot{ margin-top: 4px; }

  /* Script */
  .scene-card{ background: var(--panel-raised); border:1px solid var(--panel-line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .scene-head{ display:flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .scene-title{ font-family:'Fraunces', serif; font-weight:600; font-size: 1rem; }
  .scene-pages{ font-family:'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-faint); }
  .scene-synopsis{ font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }
  .scene-cues{ margin-top: 8px; display:flex; gap:6px; flex-wrap: wrap; }
  .scene-cue-chip{
    font-family:'IBM Plex Mono', monospace; font-size: 0.68rem;
    background: rgba(201,151,63,0.12); color: var(--gold); border:1px solid var(--gold-dim);
    padding: 2px 7px; border-radius: 999px;
  }
  .scene-cue-chip.none{ color: var(--text-faint); border-color: var(--panel-line); background:none; }

  /* Meetings */
  .meeting-card{ background: var(--panel-raised); border:1px solid var(--panel-line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .meeting-head{ display:flex; gap:10px; align-items:baseline; margin-bottom: 8px; flex-wrap: wrap; }
  .meeting-head input[type=date]{ width: 150px; }
  .meeting-head input[type=text]{ flex: 1; min-width: 160px; }
  .meeting-card textarea{ width:100%; min-height: 54px; background:#0f1116; border:1px solid var(--panel-line); color:var(--text); padding:8px; border-radius:4px; font-size:0.85rem; font-family:'Work Sans', sans-serif; margin-top: 6px; }
  .meeting-field-label{ font-family:'IBM Plex Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-top: 8px; display:block; }

  /* Best Practices timeline */
  .bp-item{ display:flex; gap: 14px; padding-bottom: 20px; position: relative; }
  .bp-item:not(:last-child)::before{
    content:''; position:absolute; left: 5px; top: 16px; bottom: -4px; width: 2px; background: var(--panel-line);
  }
  .bp-dot{ width: 12px; height: 12px; border-radius: 50%; background: var(--gold); margin-top: 3px; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(201,151,63,0.15); }
  .bp-item.bp-tech .bp-dot{ background: var(--go); box-shadow: 0 0 0 3px rgba(82,160,95,0.18); }
  .bp-content{ flex: 1; }
  .bp-head{ display:flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bp-lead{ font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); }
  .bp-item.bp-tech .bp-lead{ color: var(--go); }
  .bp-date{ font-family:'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-faint); }
  .bp-title{ font-family:'Fraunces', serif; font-weight: 600; font-size: 1rem; margin-top: 3px; }
  .bp-body{ font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-top: 5px; max-width: 640px; }

  .empty{
    text-align: center;
    padding: 30px 10px;
    color: var(--text-faint);
    font-size: 0.85rem;
  }
  .empty .big{ font-family:'Fraunces', serif; font-size: 1.4rem; color: var(--text-dim); display:block; margin-bottom: 6px; }

  /* Schedule */
  .sched-row{
    display: grid;
    grid-template-columns: 96px 1fr auto;
    gap: 10px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid #232630;
  }
  .sched-row:last-child{ border-bottom: none; }
  .sched-date{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--gold);
    padding-top: 6px;
    white-space: nowrap;
  }
  .sched-row.done .sched-label{ text-decoration: line-through; color: var(--text-faint); }
  .sched-label{ font-weight: 500; font-size: 0.9rem; }
  .sched-note{ font-size: 0.8rem; color: var(--text-dim); margin-top: 2px; }
  .check{ width: 17px; height: 17px; accent-color: var(--go); margin-top: 3px; cursor: pointer; }
  .sched-fields{ display:flex; flex-direction:column; gap:4px; }

  /* Contacts */
  .contact-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .contact-card{
    background: var(--panel-raised);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 12px 14px;
    position: relative;
  }
  .contact-name{ font-weight: 600; font-size: 0.92rem; }
  .contact-role{ font-family:'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
  .contact-line{ font-size: 0.8rem; color: var(--text-dim); margin-top: 6px; }
  .contact-card input{ width:100%; background:#0f1116; border:1px solid var(--panel-line); color:var(--text); padding:5px 7px; border-radius:4px; font-size:0.82rem; margin-top:4px; }
  .contact-card .btn-ghost{ position: absolute; top: 8px; right: 8px; }

  /* Notes */
  .note-card{ background: var(--panel-raised); border:1px solid var(--panel-line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .note-scene{ font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; display:block; width: 160px; }
  .note-card textarea{ width:100%; min-height: 60px; background:#0f1116; border:1px solid var(--panel-line); color:var(--text); padding:8px; border-radius:4px; font-size:0.86rem; font-family: 'Work Sans', sans-serif; }
  .note-card .row-top{ display:flex; justify-content: space-between; align-items:center; }

  .modal-overlay{
    position: fixed; inset: 0; background: rgba(10,11,14,0.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 40; padding: 20px;
  }
  .modal{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  .modal h3{ font-family:'Fraunces', serif; margin: 0 0 14px; }
  .modal label{ font-size: 0.75rem; color: var(--text-dim); display:block; margin: 12px 0 4px; }
  .modal input, .modal select{
    width: 100%;
    background: #0f1116;
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 8px 9px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.88rem;
  }
  .swatches{ display:flex; gap:8px; margin-top: 6px; flex-wrap: wrap; }
  .swatch{ width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected{ border-color: #fff; }
  .modal-actions{ display:flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  .save-indicator{
    position: fixed; bottom: 14px; right: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem;
    color: var(--text-faint);
    display: flex; align-items:center; gap: 6px;
    opacity: 0; transition: opacity 0.3s;
    z-index: 50;
  }
  .save-indicator.show{ opacity: 1; }
  .save-indicator .dot{ width:6px; height:6px; border-radius:50%; background: var(--go); }
  .save-indicator.error .dot{ background: var(--standby); }
</style>
</head>

<!-- ===== Firebase (Firestore + Auth) for standalone deployment ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<div id="signInScreen" style="display:none; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#12141a; color:#e9e6de; font-family:'Work Sans',sans-serif;">
  <div style="text-align:center; max-width:320px; padding:24px;">
    <div style="font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; margin-bottom:6px;">Sound Hub</div>
    <div style="color:#9195a3; font-size:0.85rem; margin-bottom:24px;">Sign in to load your production data.</div>
    <button id="googleSignInBtn" style="background:#c9973f; color:#1a1508; border:none; padding:10px 18px; border-radius:6px; font-weight:600; font-size:0.9rem; cursor:pointer;">Sign in with Google</button>
    <div id="signInError" style="color:#c1443b; font-size:0.78rem; margin-top:14px;"></div>
  </div>
</div>

<div class="app" id="app"></div>
<div class="save-indicator" id="saveIndicator"><span class="dot"></span><span id="saveText">Saved</span></div>

<script>
// ===== FIREBASE CONFIG =====
// Paste the config object from Firebase Console → Project Settings → Your apps → Web app.
const FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID",
};

firebase.initializeApp(FIREBASE_CONFIG);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();
let fbUser = null;

function userSoundhubCollection(){
  return fbDb.collection('users').doc(fbUser.uid).collection('soundhub');
}

// Drop-in replacement for the Claude-artifact window.storage API, backed by Firestore.
window.storage = {
  async get(key){
    const snap = await userSoundhubCollection().doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return { key, value: data.value, shared: false };
  },
  async set(key, value){
    await userSoundhubCollection().doc(key).set({ key, value, updatedAt: Date.now() });
    return { key, value, shared: false };
  },
  async delete(key){
    await userSoundhubCollection().doc(key).delete();
    return { key, deleted: true, shared: false };
  },
  async list(prefix){
    let q = userSoundhubCollection();
    if(prefix){
      q = q.where('key', '>=', prefix).where('key', '<', prefix + '\uf8ff');
    }
    const snaps = await q.get();
    return { keys: snaps.docs.map(d => d.id), prefix, shared: false };
  }
};

document.getElementById('googleSignInBtn').onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e => {
    document.getElementById('signInError').textContent = e.message;
  });
};

fbAuth.onAuthStateChanged(user => {
  const signInScreen = document.getElementById('signInScreen');
  const appEl = document.getElementById('app');
  if(user){
    fbUser = user;
    signInScreen.style.display = 'none';
    appEl.style.display = '';
    loadAll();
  } else {
    fbUser = null;
    signInScreen.style.display = 'flex';
    appEl.style.display = 'none';
  }
});
</script>

<script>
/* ---------------------------------------------------------
   Theatre Sound Design Hub
   Reusable, multi-show production tool for a sound designer.
   Data persists via window.storage, personal (not shared).
--------------------------------------------------------- */

const SHOWS_KEY = 'soundhub:shows';

// ---------------- state ----------------
let state = {
  shows: [],
  activeShowId: null,
  activeTab: 'schedule',
  data: {}, // showId -> showData
};

let saveTimer = null;

function flashSave(ok, text){
  const el = document.getElementById('saveIndicator');
  const t = document.getElementById('saveText');
  t.textContent = text || (ok ? 'Saved' : 'Save failed \u2014 kept locally');
  el.classList.toggle('error', !ok);
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

async function persistShows(){
  try{
    await window.storage.set(SHOWS_KEY, JSON.stringify(state.shows));
    flashSave(true);
  }catch(e){ flashSave(false); }
}
async function persistShowData(id){
  try{
    await window.storage.set(showDataKey(id), JSON.stringify(state.data[id]));
    flashSave(true);
  }catch(e){ flashSave(false); }
}

function currentData(){
  return state.data[state.activeShowId];
}

// ---------------- load ----------------
async function loadAll(){
  try{
    const res = await window.storage.get(SHOWS_KEY);
    state.shows = res ? JSON.parse(res.value) : seedShows();
  }catch(e){
    state.shows = seedShows();
  }
  if(!state.shows.length) state.shows = seedShows();
  state.activeShowId = state.shows[0].id;

  for(const s of state.shows){
    try{
      const r = await window.storage.get(showDataKey(s.id));
      const loaded = r ? JSON.parse(r.value) : null;
      const fallback = s.id === 'motoe' ? seedShowData() : blankShowData();
      state.data[s.id] = loaded ? { ...fallback, ...loaded } : fallback;
    }catch(e){
      state.data[s.id] = (s.id === 'motoe' ? seedShowData() : blankShowData());
    }
  }

  // One-time migration: earlier sessions may have already persisted an empty
  // meetings list before these dates were added to the seed. Inject them once.
  const motoeData = state.data['motoe'];
  if(motoeData && !motoeData.meetingsSeeded && motoeData.meetings.length === 0){
    motoeData.meetings = seedShowData().meetings;
    motoeData.meetingsSeeded = true;
    persistShowData('motoe');
  }

  // One-time migration: mirror the production meeting dates onto the Schedule
  // tab for sessions whose schedule was already saved before this was added.
  if(motoeData && !motoeData.scheduleMeetingsSeeded){
    const existingDates = new Set(motoeData.schedule.map(s => s.date + '|' + s.label));
    const meetingDates = ['2026-08-21','2026-08-28','2026-09-04','2026-09-11','2026-09-18'];
    meetingDates.forEach(d => {
      if(!existingDates.has(d + '|Production meeting')){
        motoeData.schedule.push({ id: uid(), date: d, label: 'Production meeting', note: '10:00\u201311:00 AM', done: false });
      }
    });
    motoeData.scheduleMeetingsSeeded = true;
    persistShowData('motoe');
  }

  // One-time migration: backfill the Drive folder link on existing sound
  // file entries and add the 9 music tracks, for sessions saved before this.
  if(motoeData && !motoeData.filesDriveLinkSeeded){
    const DRIVE_LINK = 'https://drive.google.com/drive/folders/1pwhSGbitW23qocOW3OsfO5LH7_VW9JYt?usp=sharing';
    motoeData.files.forEach(f => { if(!f.url) f.url = DRIVE_LINK; });
    const existingNames = new Set(motoeData.files.map(f => f.name));
    const musicTracks = [
      { name:'I Want to Go Back to Michigan (Irving Berlin)', type:'MUS', cueRef:'S-5', notes:'Public domain' },
      { name:'Mahler Symphony No. 1 \u2014 Vorw\u00e4rts Dr\u00e4ngend', type:'MUS', cueRef:'S-6', notes:'Public domain' },
      { name:'Alexander\u2019s Ragtime Band (Irving Berlin)', type:'MUS', cueRef:'S-35', notes:'Public domain' },
      { name:'The Charleston (James P. Johnson)', type:'MUS', cueRef:'S-15', notes:'Public domain' },
      { name:'Rossini \u2014 Overture to La Gazza Ladra', type:'MUS', cueRef:'S-21', notes:'Public domain' },
      { name:'Mahler Symphony No. 5 \u2014 St\u00fcrmisch Bewegt', type:'MUS', cueRef:'S-27', notes:'Public domain' },
      { name:'Bach Cello Suite No. 2 in D minor \u2014 Pr\u00e9lude', type:'MUS', cueRef:'S-28', notes:'Public domain \u2014 stored in "02 Song Audio Files" subfolder' },
      { name:'Haydn String Quartet Op. 76 No. 2 \u2014 Allegro', type:'MUS', cueRef:'S-30', notes:'Public domain' },
      { name:'Flight of the Bumblebee (Rimsky-Korsakov, arr. Rachmaninoff)', type:'MUS', cueRef:'S-12', notes:'Public domain' },
    ];
    musicTracks.forEach(t => {
      if(!existingNames.has(t.name)){
        motoeData.files.push({ id: uid(), name:t.name, type:t.type, cueRef:t.cueRef, url:DRIVE_LINK, notes:t.notes });
      }
    });
    motoeData.filesDriveLinkSeeded = true;
    persistShowData('motoe');
  }

  // One-time migration: correct Bach Cello Suite number (script confirms No. 2, not No. 5).
  if(motoeData && !motoeData.bachSuiteFixed){
    const s28 = motoeData.cues.find(c => c.num === 'S-28');
    if(s28){ s28.label = '* MUS: Bach Cello Suite No. 2 in D minor - first movement (Pr\u00e9lude)'; }
    const bachFile = motoeData.files.find(f => /Bach Cello Suite/i.test(f.name));
    if(bachFile){
      bachFile.name = 'Bach Cello Suite No. 2 in D minor \u2014 Pr\u00e9lude';
      bachFile.notes = 'Public domain \u2014 stored in "02 Song Audio Files" subfolder';
    }
    motoeData.bachSuiteFixed = true;
    persistShowData('motoe');
  }

  // One-time migration: S-14 director decision resolved (actress sings live over pre-recorded track).
  if(motoeData && !motoeData.s14Resolved){
    const s14 = motoeData.cues.find(c => c.num === 'S-14');
    if(s14){
      s14.label = 'SFX: Radio turns on / period radio sound';
      s14.notes = 'Resolved: actress sings live over pre-recorded music track (same approach used previously). Candidate file: MOE_SFX_Radio_Click.wav';
    }
    motoeData.s14Resolved = true;
    persistShowData('motoe');
  }

  // One-time migration: overwrite stale "Copyright needed" notes that were saved
  // before these 5 cues were confirmed public domain.
  if(motoeData && !motoeData.publicDomainNotesFixed){
    const fixes = {
      'S-5': 'Public domain \u2014 no clearance needed; note says Krista',
      'S-15': 'Public domain \u2014 no clearance needed',
      'S-27': 'Public domain \u2014 no clearance needed',
      'S-30': 'Public domain \u2014 no clearance needed',
      'S-35': 'Public domain \u2014 no clearance needed',
    };
    motoeData.cues.forEach(c => {
      if(fixes[c.num] && /copyright|permission/i.test(c.notes || '')){
        c.notes = fixes[c.num];
      }
    });
    motoeData.publicDomainNotesFixed = true;
    persistShowData('motoe');
  }

  // Log Aug 28 production meeting notes and cross-reference action items.
  if(motoeData && !motoeData.aug28MeetingLogged){
    motoeData.meetings.push({
      id: uid(),
      date: '2026-08-28',
      attendees: '',
      notes: 'Steam train interior sound wanted as an option. Gunshot SFX should be a .22 caliber shot. Need visual cues (door practicals) for the train door opening/closing while the train is moving. Need to schedule a recording session for the little girl\u2019s voice at the top of the show. Dr. K will gather period pre-show/intermission/post-show music.',
      actionItems: 'Sound: source .22 caliber gunshot SFX. Sound: schedule ADR session for Daisy Armstrong (little girl V.O.). Sound/SM: coordinate train door practicals with lighting/stage management. Dr. K: gather period pre-show/intermission/post-show music.',
    });

    const s13 = motoeData.cues.find(c => c.num === 'S-13');
    if(s13){ s13.notes = 'Resolved: director wants steam train interior sound available as an option (per 8/28 meeting).'; }

    ['S-25','S-33','S-34'].forEach(num => {
      const c = motoeData.cues.find(x => x.num === num);
      if(c && !/\.22 caliber/i.test(c.notes || '')){
        c.notes = (c.notes ? c.notes + ' ' : '') + 'Per 8/28 meeting: gunshot should be a .22 caliber shot.';
      }
    });

    motoeData.cues.push({ id: uid(), num: `S-${motoeData.cues.length+1}`, sceneAct:'', label:'SFX: Train door opening and closing while moving', trigger:'', notes:'New from 8/28 production meeting \u2014 needs visual/practical coordination with SM and lighting, not sound alone.', status:'Draft' });

    motoeData.schedule.push({ id: uid(), date: '', label: 'Schedule ADR recording session \u2014 little girl (Daisy Armstrong V.O.)', note: 'From 8/28 production meeting', done: false });

    motoeData.files.push({ id: uid(), name:'Period pre-show / intermission / post-show music', type:'MUS', cueRef:'', url:'', notes:'Dr. K gathering \u2014 from 8/28 production meeting' });

    motoeData.aug28MeetingLogged = true;
    persistShowData('motoe');
  }

  // Add the Daisy Armstrong V.O. recording as an actual cue, and expand the
  // single generic door cue into specific candidate placements throughout
  // the script wherever the train is still underway (per 8/28 follow-up).
  if(motoeData && !motoeData.doorAndVoCuesAdded){
    const existingLabels = new Set(motoeData.cues.map(c => c.label));

    if(!existingLabels.has('V.O.: Daisy Armstrong (little girl) recorded dialogue \u2014 bedtime scene through final scream')){
      motoeData.cues.push({
        id: uid(), num:'S-1A', sceneAct:'I-1',
        label:'V.O.: Daisy Armstrong (little girl) recorded dialogue \u2014 bedtime scene through final scream',
        trigger:'Playback under/in place of a live child actor at the top of the show, between the train SFX cues (S-1 and S-2)',
        notes:'Requires ADR recording session (see Schedule tab). Confirm mic/reverb treatment so the V.O. reads as being in the room rather than obviously pre-recorded.',
        status:'Draft',
      });
    }

    // Remove the earlier generic door placeholder cue in favor of specific placements.
    motoeData.cues = motoeData.cues.filter(c => c.label !== 'SFX: Train door opening and closing while moving');

    const doorTransitions = [
      { tag:'I-4 to I-5', desc:'as characters move between train cars while the train is underway' },
      { tag:'I-5 to I-6', desc:'car-to-car transition during the overnight sequence' },
      { tag:'I-6 to I-7', desc:'Michel/corridor to the observation deck' },
      { tag:'I-7 to I-8', desc:'Arbuthnot and Mary returning from the observation deck' },
      { tag:'I-8 to I-9', desc:'final transition before the train stops in the snowdrift'},
    ];
    doorTransitions.forEach(t => {
      const label = `SFX: Exterior train door open/close \u2014 ${t.tag}`;
      if(!existingLabels.has(label)){
        motoeData.cues.push({
          id: uid(), num:`S-D-${t.tag.replace(/[^0-9IV]/gi,'')}`, sceneAct:t.tag,
          label,
          trigger:`Candidate placement, ${t.desc}`,
          notes:'Proposed per 8/28 meeting \u2014 the published script does not call this out explicitly as a distinct cue; confirm exact staging/blocking and count of doors with director and SM before finalizing. Act II occurs after the train has stopped in the snowdrift, so no further placements are proposed there.',
          status:'Draft',
        });
      }
    });

    motoeData.doorAndVoCuesAdded = true;
    persistShowData('motoe');
  }
  render();
}

// ---------------- render root ----------------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="rail">
      <div class="wordmark">Sound Hub<small>Production Cue &amp; Schedule Console</small></div>
      <div class="strip-list" id="stripList"></div>
      <button class="add-show-btn" id="addShowBtn">+ New show</button>
      <div class="rail-footer">Local console<br>data stays on this device</div>
    </div>
    <div class="main" id="mainArea"></div>
  `;
  renderStrips();
  document.getElementById('addShowBtn').onclick = openNewShowModal;
  renderMain();
}

function renderStrips(){
  const list = document.getElementById('stripList');
  list.innerHTML = state.shows.map(s => `
    <button class="strip ${s.id === state.activeShowId ? 'active' : ''}" style="--show-color:${s.color}" data-id="${s.id}">
      <div class="strip-edge"></div>
      <span class="strip-tape">${escapeHtml(s.title)}</span>
      <div class="strip-meta">${escapeHtml(s.dates || '')}</div>
    </button>
  `).join('');
  list.querySelectorAll('.strip').forEach(btn => {
    btn.onclick = () => { state.activeShowId = btn.dataset.id; render(); };
  });
}

function renderMain(){
  const show = state.shows.find(s => s.id === state.activeShowId);
  const main = document.getElementById('mainArea');
  if(!show){ main.innerHTML = ''; return; }

  main.innerHTML = `
    <div class="show-header">
      <h1 class="show-title">${escapeHtml(show.title)}</h1>
      <div class="show-sub">${escapeHtml(show.subtitle || '')}<span>&middot;</span>${escapeHtml(show.venue || '')}<span>&middot;</span>${escapeHtml(show.dates || '')}
        <button class="btn btn-ghost btn-sm" id="editShowBtn" style="margin-left:8px;">edit</button>
        ${state.shows.length > 1 ? `<button class="btn btn-ghost btn-sm" id="deleteShowBtn">delete show</button>` : ''}
      </div>
    </div>
    <div class="waveline" id="waveline"></div>
    <div class="tabs">
      ${tabDef('schedule','Schedule')}
      ${tabDef('cues','Cues')}
      ${tabDef('files','Sound Files')}
      ${tabDef('cast','Cast')}
      ${tabDef('script','Script')}
      ${tabDef('notes','Notes')}
      ${tabDef('meetings','Meeting Notes')}
      ${tabDef('contacts','Contacts')}
      ${tabDef('bestpractices','Best Practices')}
    </div>
    <div id="tabContent"></div>
  `;
  buildWaveline();

  document.getElementById('editShowBtn').onclick = () => openEditShowModal(show);
  const delBtn = document.getElementById('deleteShowBtn');
  if(delBtn) delBtn.onclick = () => deleteShow(show.id);

  main.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => { state.activeTab = btn.dataset.tab; renderMain(); };
  });

  const content = document.getElementById('tabContent');
  if(state.activeTab === 'cast') content.innerHTML = castTemplate();
  if(state.activeTab === 'script') content.innerHTML = scriptTemplate();
  if(state.activeTab === 'cues') content.innerHTML = cuesTemplate();
  if(state.activeTab === 'schedule') content.innerHTML = scheduleTemplate();
  if(state.activeTab === 'files') content.innerHTML = filesTemplate();
  if(state.activeTab === 'meetings') content.innerHTML = meetingsTemplate();
  if(state.activeTab === 'contacts') content.innerHTML = contactsTemplate();
  if(state.activeTab === 'notes') content.innerHTML = notesTemplate();
  if(state.activeTab === 'bestpractices') content.innerHTML = bestPracticesTemplate();

  wireTabEvents();
}

function tabDef(id, label){
  return `<button class="tab-btn ${state.activeTab===id?'active':''}" data-tab="${id}">${label}</button>`;
}

function buildWaveline(){
  const wl = document.getElementById('waveline');
  let bars = '';
  for(let i=0;i<48;i++){
    const h = 4 + Math.round(Math.abs(Math.sin(i*0.7))*10);
    const delay = (i * 0.04).toFixed(2);
    bars += `<i style="height:${h}px; animation-delay:${delay}s;"></i>`;
  }
  wl.innerHTML = bars;
}

function autoGrow(el){
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function formatDate(iso){
  if(!iso) return 'No date';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}

function cueIsFlagged(c){
  return /copyright|permission|ask director/i.test(c.notes || '');
}

function cuesTemplate(){
  const data = currentData();
  const flaggedCount = data.cues.filter(cueIsFlagged).length;

  const decisions = data.cues.filter(c => /ask director/i.test(c.notes || ''));
  const decisionRows = decisions.map(c => `
    <div class="todo-row decision">
      <span class="flag-dot"></span>
      <div>
        <div class="todo-label">${escapeHtml(c.num)} \u2014 ${escapeHtml(c.label)}</div>
        <div class="sched-note">${escapeHtml(c.notes)}</div>
      </div>
      <div></div>
    </div>
  `).join('');
  const decisionsPanel = decisions.length ? `
    <div class="panel">
      <div class="panel-head">
        <h3>Open decisions</h3>
        <span class="hint">${decisions.length} awaiting director input</span>
      </div>
      <div>${decisionRows}</div>
    </div>` : '';

  const rows = data.cues.map(c => `
    <tr data-id="${c.id}" class="${cueIsFlagged(c) ? 'flag-row' : ''}">
      <td><input type="text" class="field cue-num" value="${escapeHtml(c.num)}" style="width:52px" placeholder="Q1"></td>
      <td style="width:78px"><input type="text" class="field cue-scene" value="${escapeHtml(c.sceneAct)}" placeholder="I.iii"></td>
      <td><textarea class="field cue-label" rows="2" placeholder="Description">${escapeHtml(c.label)}</textarea></td>
      <td><textarea class="field cue-trigger" rows="2" placeholder="Trigger / QLab note">${escapeHtml(c.trigger)}</textarea></td>
      <td>${cueIsFlagged(c) ? '<span class="flag-dot" title="Needs rights clearance or director input"></span>' : ''}<textarea class="field cue-notes" rows="2" placeholder="Notes, candidate files, flags">${escapeHtml(c.notes)}</textarea></td>
      <td style="width:118px">
        <select class="field cue-status">
          ${['Draft','Programmed','Confirmed'].map(s => `<option ${c.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td><button class="btn btn-ghost btn-sm cue-del" title="Delete cue">\u2715</button></td>
    </tr>
  `).join('');

  return `
    ${decisionsPanel}
    <div class="panel">
      <div class="panel-head">
        <h3>Cue list</h3>
        <button class="btn btn-gold btn-sm" id="addCueBtn">+ Add cue</button>

      <table>
        <thead><tr><th>Cue</th><th>Scene</th><th>Description</th><th>Trigger</th><th>Notes</th><th>Status</th><th></th></tr></thead>
        <tbody id="cueRows">${rows}</tbody>
      </table>
      </div>`}
    </div>
  `;
}

    const notesEl = row.querySelector('.cue-notes');
    notesEl.oninput = () => autoGrow(notesEl);
    notesEl.onchange = e => { cue.notes = e.target.value; persistShowData(state.activeShowId); renderMain(); };
    row.querySelector('.cue-status').onchange = e => { cue.status = e.target.value; persistShowData(state.activeShowId); };

      data.cues = data.cues.filter(c => c.id !== id);

function scheduleTemplate(){
  const data = currentData();
  const today = todayStr();
  const sorted = [...data.schedule].sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const rows = sorted.map(item => `
    <div class="sched-row ${item.done ? 'done' : ''}" data-id="${item.id}">
      <div>
        <input type="date" class="field sched-date-input" value="${escapeHtml(item.date)}" style="${!item.done && item.date && item.date < today ? 'border-color:var(--standby); color:var(--standby);' : ''}">
      </div>
      <div class="sched-fields">
        <input type="text" class="field sched-label-input" value="${escapeHtml(item.label)}" placeholder="Milestone">
        <input type="text" class="field sched-note-input" value="${escapeHtml(item.note)}" placeholder="Notes (optional)">
      </div>
      <div style="display:flex; gap:8px; align-items:center; padding-top:6px;">
        <input type="checkbox" class="check sched-done" ${item.done ? 'checked' : ''} title="Mark done">
        <button class="btn btn-ghost btn-sm sched-del">\u2715</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="panel">
      <div class="panel-head">
        <h3>Schedule &amp; deadlines</h3>
        <button class="btn btn-gold btn-sm" id="addSchedBtn">+ Add date</button>
      </div>
      ${data.schedule.length === 0 ? `<div class="empty"><span class="big">Nothing scheduled</span>Add tech dates, deliverable deadlines, or rehearsal calls you need to track.</div>` : `<div>${rows}</div>`}
    </div>
  `;
}

// ---------------- BEST PRACTICES ----------------
function getTechStartDate(data){
  const techItems = data.schedule.filter(s => /^tech\b/i.test((s.label||'').trim()) && s.date);
  if(!techItems.length) return null;
  return techItems.map(s => s.date).sort()[0];
}

function addDaysToISO(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function bestPracticesTemplate(){
  const data = currentData();
  const techStart = getTechStartDate(data);

  const milestones = [
    { weeksBefore: 9, title: 'Concept meeting with the director', body: 'Sit down with the director early to align on tone, era, and the overall sonic world of the show \u2014 before you\u2019ve sourced or committed to anything. This is where you find out if the director is picturing something stylized and theatrical or something naturalistic, so you\u2019re not designing in the wrong direction for weeks.' },
    { weeksBefore: 5, title: 'Share a draft cue list and reference tracks', body: 'Send the director a rough pass \u2014 candidate music, SFX ideas, and a first cut of the cue list \u2014 the same way you did with the music review document. This is the single most important cushion point: if the director wants a different piece of music, a different tone, or has a rights concern, you still have weeks to pivot instead of days.' },
    { weeksBefore: 3, title: 'Incorporate director feedback', body: 'Lock in any swaps, re-recordings, or re-licensing this round of notes requires. Anything raised at the 5-week mark should be resolved by now, so nothing new is still in flux heading into the final stretch.' },
    { weeksBefore: 1, title: 'Final cues locked & sent to the stage manager', body: 'Cue list and files are final \u2014 no more open creative questions. This is what feeds the SM\u2019s prompt book and is the version everyone builds tech around.' },
  ];

  const rows = milestones.map(m => {
    const suggested = techStart ? addDaysToISO(techStart, -m.weeksBefore * 7) : null;
    return `
    <div class="bp-item">
      <div class="bp-dot"></div>
      <div class="bp-content">
        <div class="bp-head">
          <span class="bp-lead">${m.weeksBefore} week${m.weeksBefore === 1 ? '' : 's'} before tech</span>
          ${suggested ? `<span class="bp-date">${formatDate(suggested)}</span>` : ''}
        </div>
        <div class="bp-title">${escapeHtml(m.title)}</div>
        <div class="bp-body">${escapeHtml(m.body)}</div>
      </div>
    </div>`;
  }).join('');

  const techRow = `
    <div class="bp-item bp-tech">
      <div class="bp-dot"></div>
      <div class="bp-content">
        <div class="bp-head">
          <span class="bp-lead">Tech week begins</span>
          ${techStart ? `<span class="bp-date">${formatDate(techStart)}</span>` : ''}
        </div>
        <div class="bp-title">Refinement only from here on</div>
        <div class="bp-body">Once tech starts, you're plugging in and balancing what's already been decided \u2014 not introducing new creative choices. Any cue that's still an open question by this point (see the flagged items on your Cues tab) becomes a live-fire problem instead of a planning one.</div>
      </div>
    </div>`;

  return `
    <div class="panel">
      <div class="panel-head">
        <h3>Best-practice timeline for sound design</h3>
        ${techStart ? `<span class="hint">Calculated from this show\u2019s earliest "Tech" date on the Schedule tab</span>` : `<span class="hint">Add a schedule item starting with "Tech" to calculate suggested dates</span>`}
      </div>
      <div class="hint" style="margin:-4px 0 14px;">General guidance, not specific to this script \u2014 the core principle is simple: the further from tech you get the director listening to actual candidate music and reacting to a draft cue list, the more room you have to fix anything they push back on. Waiting until paper tech to get director input leaves no cushion at all.</div>
      ${rows}
      ${techRow}
    </div>
  `;
}

// ---------------- Show modals ----------------
function openNewShowModal(){
  showModal({
    title: 'New show',
    values: { title:'', subtitle:'', venue:'', dates:'', color: SHOW_COLORS[state.shows.length % SHOW_COLORS.length] },
    onSave: (vals) => {
      const id = uid();
      state.shows.push({ id, ...vals });
      state.data[id] = blankShowData();
      state.activeShowId = id;
      state.activeTab = 'cues';
      persistShows();
      persistShowData(id);
      render();
    }
  });
}

function openEditShowModal(show){
  showModal({
    title: 'Edit show',
    values: { title: show.title, subtitle: show.subtitle||'', venue: show.venue||'', dates: show.dates||'', color: show.color },
    onSave: (vals) => {
      Object.assign(show, vals);
      persistShows();
      render();
    }
  });
}

function showModal({title, values, onSave}){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${escapeHtml(title)}</h3>
      <label>Show title</label>
      <input type="text" id="m-title" value="${escapeHtml(values.title)}" placeholder="e.g. Antigone">
      <label>Writer / director credit</label>
      <input type="text" id="m-subtitle" value="${escapeHtml(values.subtitle)}" placeholder="e.g. Sophocles \u2014 dir. Eric Harrell">
      <label>Venue</label>
      <input type="text" id="m-venue" value="${escapeHtml(values.venue)}" placeholder="e.g. Studio Theatre">
      <label>Run dates</label>
      <input type="text" id="m-dates" value="${escapeHtml(values.dates)}" placeholder="e.g. Feb 12\u201314 &amp; 19\u201321">
      <label>Color tag</label>
      <div class="swatches" id="m-swatches">
        ${SHOW_COLORS.map(c => `<span class="swatch ${c===values.color?'selected':''}" data-color="${c}" style="background:${c}"></span>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn btn-gold" id="m-save">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  let selectedColor = values.color;
  overlay.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      overlay.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      selectedColor = sw.dataset.color;
    };
  });
  overlay.querySelector('#m-cancel').onclick = () => overlay.remove();
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  overlay.querySelector('#m-save').onclick = () => {
    const titleVal = overlay.querySelector('#m-title').value.trim();
    if(!titleVal){ overlay.querySelector('#m-title').focus(); return; }
    onSave({
      title: titleVal,
      subtitle: overlay.querySelector('#m-subtitle').value.trim(),
      venue: overlay.querySelector('#m-venue').value.trim(),
      dates: overlay.querySelector('#m-dates').value.trim(),
      color: selectedColor
    });
    overlay.remove();
  };
}

function deleteShow(id){
  if(!confirm('Delete this show and all its data? This cannot be undone.')) return;
  state.shows = state.shows.filter(s => s.id !== id);
  delete state.data[id];
  state.activeShowId = state.shows[0]?.id || null;
  persistShows();
  try{ window.storage.delete(showDataKey(id)); }catch(e){}
  render();
}
